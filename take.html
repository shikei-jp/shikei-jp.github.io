<style>
:root{
  /* 暗い客席に、縦長の舞台が一つ灯る。左に演目、中央に舞台、右に演出ノート */
  --night:#0a0d14;
  --booth:#111621;
  --rule:#232b3c;
  --text:#e9e4d9;
  --dim:#97a0b2;
  --dawn:#efa062;
  --sea:#79c0c4;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","YuGothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--dawn);outline-offset:3px}

.app{display:grid;grid-template-columns:230px minmax(0,1fr) 330px;grid-template-areas:"brand brand brand" "programs theater notes";gap:20px 32px;padding:20px 28px 40px;min-height:100%;max-width:1400px;margin:0 auto}
.brand{grid-area:brand;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:12px}
.brand h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.18em;margin:0}
.brand p{margin:0;color:var(--dim);font-size:14px;letter-spacing:.06em}

.programs{grid-area:programs;display:flex;flex-direction:column;gap:10px}
.programs h2,.notes h2,.notes h3{font-family:var(--ui);font-weight:500;font-size:12px;letter-spacing:.24em;color:var(--dim);margin:0 0 2px}
.program{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:4px;background:transparent}
.program .pt{font-family:var(--display);font-weight:700;font-size:18px}
.program .pa{grid-column:1/-1;color:var(--dim);font-size:12.5px}
.program .ps{font-size:11px;letter-spacing:.1em;color:var(--dim)}
button.program{cursor:pointer}
button.program:hover{border-color:var(--dim)}
.program.is-current{border-color:var(--dawn);background:linear-gradient(180deg,rgba(239,160,98,.10),rgba(239,160,98,0))}
.program.is-current .ps{color:var(--dawn)}
.program.is-soon{opacity:.55}
.programs .about{color:var(--dim);font-size:12.5px;margin:8px 0 0;line-height:1.8}

.theater{grid-area:theater;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.rig{width:min(calc(78vh * 9 / 16),100%);display:flex;flex-direction:column;gap:10px}
.stage{position:relative;width:100%;aspect-ratio:9/16;border-radius:6px;overflow:hidden;background:#05070b;box-shadow:0 0 0 1px var(--rule),0 30px 80px rgba(0,0,0,.65);--u:1px;--fs:37}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.verse{position:absolute;inset:0;pointer-events:none}
.group{position:absolute;display:flex;flex-direction:row-reverse;gap:calc(var(--u)*16);top:7%;right:7%}
.line{writing-mode:vertical-rl;font-family:var(--display);font-weight:700;font-size:calc(var(--u) * var(--fs));letter-spacing:.14em;line-height:1;color:#fff4e6;text-shadow:0 0 calc(var(--u)*14) rgba(20,10,20,.55),0 0 calc(var(--u)*3) rgba(20,10,20,.5);opacity:0;will-change:opacity,transform,filter}
.line rt{font-size:.36em;font-weight:500;letter-spacing:.05em}
.line .ch{opacity:0}
.line .ch rt{opacity:0}
.group.tone-sea{top:8%;right:8%}
.group.tone-sea .line{color:#dcf0f3;text-shadow:0 0 calc(var(--u)*16) rgba(0,10,25,.8)}
.group.tone-sepia .line{color:#f4e5c6;text-shadow:0 0 calc(var(--u)*12) rgba(30,18,6,.75)}
.group.tone-ink .line{color:#1e2421;text-shadow:0 0 calc(var(--u)*10) rgba(255,255,255,.8),0 0 calc(var(--u)*3) rgba(255,255,255,.75)}
.title-card.ink .tt,.title-card.ink .ta{color:#1e2421;text-shadow:0 0 calc(var(--u)*14) rgba(255,255,255,.85)}
.group.tone-sky .line{color:#ffffff;text-shadow:0 0 calc(var(--u)*14) rgba(8,28,60,.9),0 0 calc(var(--u)*3) rgba(8,28,60,.85)}
.group.tone-frost .line{color:#eaf5ff;text-shadow:0 0 calc(var(--u)*14) rgba(0,10,30,.85)}
.group.tone-night .line{color:#d8dbe7;text-shadow:0 0 calc(var(--u)*16) rgba(0,0,8,.9)}
.title-card{position:absolute;top:22%;left:0;right:0;display:flex;flex-direction:row-reverse;justify-content:center;align-items:flex-start;gap:calc(var(--u)*22);pointer-events:none}
.title-card .tt{writing-mode:vertical-rl;font-family:var(--display);font-weight:800;font-size:calc(var(--u)*78);letter-spacing:.3em;margin:0;line-height:1;color:#fff6ea;text-shadow:0 0 calc(var(--u)*24) rgba(30,10,30,.6)}

.big-play svg{width:14px;height:14px}
.big-play[hidden]{display:none}

.controls{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px}
.ctl{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--booth);cursor:pointer}
.ctl svg{width:15px;height:15px}
.ctl:hover{border-color:var(--dim)}
.clock{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--dim);letter-spacing:.04em;white-space:nowrap}
.track{position:relative;height:28px;cursor:pointer;touch-action:none}
.track .rail{position:absolute;left:0;right:0;top:13px;height:2px;background:var(--rule);border-radius:2px}
.track .fill{position:absolute;left:0;top:13px;height:2px;background:linear-gradient(90deg,var(--dawn),var(--sea));border-radius:2px;width:0}
.track .tick{position:absolute;top:8px;width:1px;height:12px;background:var(--dim);opacity:.6}
.track .tick.turn{background:var(--sea);opacity:1;height:16px;top:6px}
.vol{display:flex;align-items:center;gap:6px;grid-column:1/-1;justify-self:end;color:var(--dim);font-size:12px}

.notes{grid-area:notes;display:flex;flex-direction:column;gap:22px;min-width:0}

.text-list .tc{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--dim)}
.text-list .tx{font-family:var(--display);font-size:16px;font-weight:500;padding:2px 0;border-radius:2px}
.text-list li:hover .tx,.text-list li:focus-within .tx{color:var(--dawn)}
.text-list li.now .tx{color:var(--dawn)}
.text-list li.alt.now .tx{color:var(--sea)}
.text-list rt{font-size:.5em}
.cue{display:grid;grid-template-columns:4.4em 1fr;gap:4px 10px;margin:8px 0 0;font-size:13.5px;line-height:1.75}
.cue dt{color:var(--dim);font-size:12px;letter-spacing:.12em;padding-top:2px}
.cue dd{margin:0}
.scale{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.readings{display:flex;flex-direction:column;gap:16px;margin-top:8px}
.rd{border-left:2px solid var(--rule);padding:2px 0 2px 12px}
.rd .rq{display:block;width:100%;text-align:left;border:0;background:none;padding:0;margin:0 0 5px;font-family:var(--display);font-weight:700;font-size:15.5px;line-height:1.6;cursor:pointer}
.rd .rq:hover{color:var(--dawn)}
.rd .rq rt{font-size:.5em}
.rd p{margin:0;font-size:13.5px;line-height:1.8}
.rd .lb{display:inline-block;font-size:11px;letter-spacing:.12em;color:var(--dim);min-width:3.6em}
.rd .rs{color:#c4cad5;margin-top:3px}
.rd.now{border-left-color:var(--dawn)}
.rights{font-size:12.5px;color:var(--dim);line-height:1.8;border-top:1px solid var(--rule);padding-top:12px;margin:0}

@media (max-width:1080px){
  .app{grid-template-columns:200px minmax(0,1fr);grid-template-areas:"brand brand" "programs theater" "notes notes"}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"brand" "theater" "notes" "programs";padding:14px 16px 32px;gap:18px}
  .rig{width:min(calc(74vh * 9 / 16),100%)}
}
/* 動画の書き出し用：舞台だけを画面いっぱいに */
body.film .brand,body.film .programs,body.film .notes,body.film .controls,body.film .big-play,body.film .opts{display:none!important}
body.film .app{display:block;padding:0;max-width:none;min-height:0}
body.film .theater{display:block}
body.film .rig{width:100vw}
body.film .credit{font-size:calc(var(--u)*21);bottom:40%}
body.film .credit small{font-size:calc(var(--u)*13.5);margin-top:.5em;line-height:2}
body.film .stage{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;box-shadow:none}
</style>

<body>
<div class="app">
  <header class="brand">
    <h1>詩景</h1>
    <p>詩に、景色と音を。一編ずつ、その詩のための映像と音楽を仕立てて上演します。</p>
  </header>

  <nav class="programs" aria-label="演目">
    <h2>演目</h2>
    <div id="programList" style="display:flex;flex-direction:column;gap:10px"></div>
    <p class="about">取り上げるのは、日本でも米国でも著作権の保護期間が終わった詩だけです。</p>
  </nav>

  <main class="theater">
    <div class="rig">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="verse" id="verse">
          <div class="title-card" id="titleCard"><h2 class="tt" id="titleText"></h2><p class="ta" id="titleAuthor"></p></div>
        </div>
        <p class="credit" id="credit"></p>
        <button class="big-play" id="bigPlay" type="button"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 1l11 6-11 6z" fill="currentColor"/></svg>上演する</button>
      </div>
      <div class="controls">
        <button class="ctl" id="btnPlay" type="button" aria-label="再生"><svg viewBox="0 0 14 14" aria-hidden="true"><path id="icoPlay" d="M3 1l10 6-10 6z" fill="currentColor"/></svg></button>
        <button class="ctl" id="btnRestart" type="button" aria-label="最初から"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2.2a4.8 4.8 0 1 1-4.5 3.1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M1.2 1.6l1.6 4.2 4-1.7z" fill="currentColor"/></svg></button>
        <div class="track" id="track" role="slider" aria-label="上演の位置" aria-valuemin="0" aria-valuemax="52" aria-valuenow="0" tabindex="0">
          <div class="rail"></div><div class="fill" id="fill"></div>
        </div>
        <span class="clock" id="clock">0:00 / 0:52</span>
        <label class="vol" for="vol">音量 <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
      </div>
    </div>
  </main>

  <aside class="notes" aria-label="演出ノート">
    <header>
      <h2>演出ノート</h2>
      <p class="ttl" id="noteTitle"></p>
      <p class="meta" id="noteMeta"></p>
    </header>
    <section>
      <h3>本文（行を押すと、そこから上演）</h3>
      <ol class="text-list" id="textList"></ol>
    </section>
    <p class="rights" id="rights"></p>
  </aside>
</div>

<script>
(() => {
"use strict";

/* ===================== 演目の入れ物と、字の割り振り ===================== */
// 各演目のファイルが、自分の POEMS.<id> を足す（場面・楽譜・本文を一つのファイルにまとめる）
const POEMS = {};
// 本文の html を、一字（ルビは一語）ずつの単位に分け、音の数を付ける。kanji は漢字一字の音の数の表
function verseUnits(html, kanji = {}) {
  const out = [], re = /<ruby>(.*?)<rt>(.*?)<\/rt><\/ruby>|([^<])/g; let m;
  while ((m = re.exec(html))) {
    if (m[3] !== undefined) { const ch = m[3], punct = "、。，．！？".includes(ch) ? ch : ""; out.push({ html: ch, mora: punct || /[\s　]/.test(ch) ? 0 : /[ゃゅょャュョぁぃぅぇぉ]/.test(ch) ? 0 : (kanji[ch] || 1), punct }); }
    else out.push({ html: `<ruby>${m[1]}<rt>${m[2]}</rt></ruby>`, mora: [...m[2]].filter(c => !/[ゃゅょャュョぁぃぅぇぉ]/.test(c)).length, punct: "" });
  }
  return out;
}
/* ===================== 小道具 ===================== */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
const lerp = (a, b, u) => a + (b - a) * u;
const mixc = (c1, c2, u) => [0, 1, 2].map(i => Math.round(lerp(c1[i], c2[i], u)));
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ===================== 大漁：本文と、声に出す時間 ===================== */
// 二連・十行（四行＋六行）。画面の文字は三つの場面に分ける：浜の歓声／「けど」の転換／海の中。
// どの二行も「七音（初めと終わりは八音）＋五音」で一つの句になる。二連は「するだろう。」まで一続きの文。
const TAIRYO_TEXT = [
  ["朝焼小焼だ", "大漁だ", "<ruby>大羽<rt>おおば</rt></ruby><ruby>鰮<rt>いわし</rt></ruby>の", "大漁だ。"],
  ["浜は祭りの", "ようだけど"],
  ["海のなかでは", "何万の", "<ruby>鰮<rt>いわし</rt></ruby>のとむらい", "するだろう。"]
];
const TAIRYO_KANJI = { "朝": 2, "焼": 2, "小": 1, "大": 2, "漁": 2, "浜": 2, "祭": 2, "海": 2, "何": 2, "万": 2 };
// 祭りの拍（104 拍/分）。太鼓と篠笛は 4.0 秒から。笛の旋律 [音, 拍] は、「ようだけど」を置く時刻も決める
const TAIRYO_B = 60 / 104, TAIRYO_S0 = 4.0;
const TAIRYO_MEL = [
  [81, 1], [83, .5], [81, .5], [79, 1], [76, 1], [74, 1.5], [76, .5], [79, 2],   // 一連の掛け声の下で
  [86, 1], [88, 1], [86, .5], [83, .5], [81, 1], [83, 1], [81, 1], [79, 2],     // 二度目の「大漁だ。」から、いちばん高い句
  [76, 1], [79, 1], [81, 1], [83, 1]                                           // 上りつめて、長い音へ
];
// 以前は一つ目と二つ目のあいだに [81,1],[86,1],[83,.5],[81,.5],[79,1],[81,3],[0,1] の句があった。
// 一連を速く読むようにしたので外した（残すと、一連と二連のあいだが約 11 秒になる）。戻せば、二連から後ろは 4.6 秒あとへずれる。
// 読む速さ（一音の秒）。前半は祭りの弾む速さ、「海のなかでは」から一行ごとに遅く
const TAIRYO_FEST = 0.125;
const TAIRYO_SLOW = [0.17, 0.18, 0.19, 0.2];
const TAIRYO_REST = [0.6, 1.5, 0.7];   // 海の中の行のあとの間（とむらいの静けさで長め）。「何万の」のあとは数の重さの間
const TAIRYO_T = (() => {
  const B = TAIRYO_B, S0 = TAIRYO_S0, m1 = TAIRYO_FEST, p1 = 0.3 * m1 / 0.135;   // 句読点のない行末の短い間（落葉松と同じ割合）
  const U = TAIRYO_TEXT.map(st => st.map(h => verseUnits(h, TAIRYO_KANJI)));
  const mo = us => us.reduce((a, u) => a + u.mora, 0);
  const at = (us, ch) => us.findIndex(u => u.html === ch);
  const daOf = us => { let i = us.length - 1; while (i > 0 && !us[i].mora) i--; return us[i].html === "だ" ? i : -1; };
  // 一行を t から一音 m 秒で並べる。ルビは一語で一単位。「。」は前の字の音が終わる時刻に出る。last は最後の一音をのばす倍率
  const lay = (k, j, t, m, last = 1) => {
    const units = U[k][j], times = [], N = mo(units); let c = t, n = 0;
    for (const u of units) { times.push(c); for (let q = 0; q < u.mora; q++) c += m * (++n === N ? last : 1); }
    const d = daOf(units);
    return { t, end: c, g: k, j, html: TAIRYO_TEXT[k][j], units, times, mora: m, da: d < 0 ? null : times[d] };
  };
  const lines = [];
  // 一連：「〜だ」で終わる行は、「だ」の字を太鼓の拍にそろえる。そろえたずれは、前の「だ」からのあいだの間に等しく分ける
  const pz = U[0].map(() => p1); let t1 = S0 + 0.25, prev = -1;
  const lay1 = () => { const s = [t1]; for (let j = 1; j < U[0].length; j++) s.push(s[j - 1] + mo(U[0][j - 1]) * m1 + pz[j]); return s; };
  U[0].forEach((us, j) => {
    const d = daOf(us); if (d < 0) return;
    const nat = lay1()[j] + mo(us.slice(0, d)) * m1, n = j - prev;
    let beat = S0 + Math.round((nat - S0) / B) * B;
    if (prev >= 0 && p1 + (beat - nat) / n < 0.2) beat += B;
    if (prev < 0) t1 += beat - nat; else for (let q = prev + 1; q <= j; q++) pz[q] += (beat - nat) / n;
    prev = j;
  });
  lay1().forEach((s, j) => lines.push(lay(0, j, s, m1)));
  // 二連のはじめ：祭りの速さのまま。「けど」の「け」を、笛の長い音が半音下がる瞬間にそろえる
  const ln = S0 + TAIRYO_MEL.reduce((a, n) => a + n[1], 0) * B, bend = ln + 1.0;
  const s6 = bend - mo(U[1][1].slice(0, at(U[1][1], "け"))) * m1, s5 = s6 - p1 - mo(U[1][0]) * m1;

const TAIRYO_L = (k, j) => TAIRYO_T.lines[[0, 4, 6][k - 1] + j];   // k：場面（1〜3）、j：その中の行（0 から）

/* ===================== 映像：大漁 ===================== */
const W = 540, H = 960;

  const boats = [

    { x: 0.79 * W, s: 1.22, ph: 2.2, flag: 1, net: true },
    { x: 1.02 * W, s: 0.88, ph: 4.0, flag: 2, net: false }

  const motes = Array.from({ length: 150 }, () => ({ x: rnd(0, W), y: rnd(WL, WL + 1.5 * H), sp: rnd(2, 7), ph: rnd(0, 6.28), r: rnd(0.6, 1.5) }));
  const bubbles = Array.from({ length: 90 }, (_, i) => {

  });
  const snow = Array.from({ length: 170 }, () => ({ x: rnd(0, W), y: rnd(0, H), sp: rnd(6, 16), ph: rnd(0, 6.28), r: rnd(0.7, 1.8) }));

  const NF = 900;
  const fish = Array.from({ length: NF }, (_, i) => ({ i, a: rnd(0, 6.283), r: Math.sqrt(rnd()), w: rnd(0.32, 0.55), ph: rnd(0, 6.283), lane: rnd(), s0: rnd(), sz: rnd(0.75, 1.2), b: rnd(0.45, 1), late: i >= NF * 0.42, sp: rnd(0.85, 1.15) }));

      g.save(); g.beginPath(); g.rect(-5, -20, W + 10, WL + 20); g.clip();
      const lg = g.createLinearGradient(0, HZ - 0.08 * H, 0, WL); lg.addColorStop(0, rgba(mixc([28, 20, 30], [52, 34, 38], dawn))); lg.addColorStop(1, "rgb(20,15,22)");

      const ex = ss(S0, da1 + 0.7, t) * (0.5 + 0.5 * ss(da2 - 1.2, da2 + 1.8, t)) * (1 - ss(tD + 0.4, tD + 3.4, t));

          g.fillStyle = "#3a2a26"; g.fillRect(-32, -30, 24, 19);
          g.strokeStyle = "#1d1515"; g.lineWidth = 2.2; g.beginPath(); g.moveTo(14, -15); g.lineTo(14, -132); g.stroke();

const mf = m => 440 * Math.pow(2, (m - 69) / 12);

class Engine {

function updateVerse(t) {
  titleCard.style.opacity = (1 - ss(P.titleFade[0], P.titleFade[1], t)).toFixed(3);
  P.lines.forEach((l, i) => {
    const gr = P.groups[l.g], gOut = 1 - ss(gr.out[0], gr.out[1], t), el = lineEls[i];

        sp.style.filter = p2 > 0 && p2 < 1 ? `blur(calc(var(--u) * ${(3 * (1 - p2)).toFixed(2)}))` : "none";

    }
    const next = P.lines[i + 1], cur = t >= l.t && (next ? t < next.t : t < gr.out[1]);
    listItems[i].classList.toggle("now", cur);
  });
  credit.style.opacity = ss(P.credit[0], P.credit[1], t).toFixed(3);
  (P.reading || []).forEach((r, i) => { const nx = P.reading[i + 1]; if (readEls[i]) readEls[i].classList.toggle("now", t > 0.05 && t >= r.t && (nx ? t < nx.t : t < P.dur)); });
}

const t0 = performance.now();
function frame() {
  let t = now();
  if (st.playing && t >= P.dur) { finish(); t = P.dur; }
  const rt = FILM ? t : (performance.now() - t0) / 1000;
  P.scene.render(g, S, t, reduced ? rt * 0.4 : rt);
  updateVerse(t);
  fillEl.style.width = `${(t / P.dur) * 100}%`;
  clock.textContent = `${fmt(t)} / ${fmt(P.dur)}`;
  track.setAttribute("aria-valuenow", t.toFixed(1));
  requestAnimationFrame(frame);
}

resize();
load(POEMS[location.hash.slice(1)] ? location.hash.slice(1) : "take");
requestAnimationFrame(frame);

// 確かめ用：指定の秒の絵を出す（音は鳴らさない）
window.__shikeiShow = t => { engine.stop(); st.playing = false; st.fallback = null; st.t = t; setPlayingUI(false); };
window.__shikeiLoad = id => load(id);
window.__shikeiFrame = t => { engine.stop(); st.playing = false; st.fallback = null; st.t = t; P.scene.render(g, S, t, t); updateVerse(t); };
window.__shikeiDebug = { Engine, POEMS };
})();
</script>
